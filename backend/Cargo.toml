[package]
name = "wendy"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
tauri-plugin-wallpaper = "4.1.0"
tauri-plugin-persisted-scope = { version = "2.4.3", features = [
    "protocol-asset",
] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
