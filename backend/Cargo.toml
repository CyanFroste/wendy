[package]
name = "wendy"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Cyan Froste"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
tauri-plugin-wallpaper = "4.1.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
parking_lot = "0.13.0"
sysinfo = "0.40.3"
walkdir = "2.5.0"
base64 = "0.23.1"
systemicons = "0.9.13"
open = "5.4.5"
cpal = "0.18.2"
reqwest = "0.13.5"
url = "2.5.8"
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    # SMTC media info & album art
    "Media_Control",
    "Storage_Streams",
    "Foundation_Collections",
    "System",
    "ApplicationModel",
    # Direct COM master volume control
    "Win32_System_Com",
    "Win32_Media_Audio_Endpoints",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
